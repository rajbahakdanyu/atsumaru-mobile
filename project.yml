name: Atsumaru
options:
  bundleIdPrefix: dev.atsumaru
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 8.0.0
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.5.0
targets:
  Core:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Core/Sources]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  CoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Core/Tests]
    dependencies:
      - target: Core
      - target: Atsumaru
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Core/Tests/CoreTests.entitlements
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Atsumaru.app/Atsumaru"
        BUNDLE_LOADER: "$(TEST_HOST)"
  Atsumaru:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Atsumaru]
    dependencies:
      - target: Core
      - package: Kingfisher
      - package: Textual
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.atsumaru.app
        INFOPLIST_FILE: Atsumaru/Info.plist
        CODE_SIGN_ENTITLEMENTS: Atsumaru/Atsumaru.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 29M3656LH6
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Atsumaru/Atsumaru.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.atsumaru.app
    info:
      path: Atsumaru/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - dev.atsumaru.app.refresh
          - dev.atsumaru.app.processing
        CFBundleURLTypes:
          - CFBundleURLName: dev.atsumaru.app
            CFBundleURLSchemes: [atsumaru]
schemes:
  Core:
    build:
      targets:
        Core: all
        Atsumaru: [test]
        CoreTests: [test]
    test:
      targets:
        - CoreTests